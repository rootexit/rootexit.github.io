<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF转图片</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/editor.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.15.2/viewer.min.css" />
    <style>
      /* ===== 本页差异样式（通用部分已提取至 ../css/*.css） ===== */
      .pdf-grid {
        display: grid;
        grid-template-columns: 0.9fr 1.6fr;
        gap: 20px;
        align-items: stretch;
      }

      .pdf-grid .editor-panel {
        min-height: 520px;
        display: flex;
        flex-direction: column;
      }

      .field-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        color: var(--ink);
        font-weight: 600;
      }

      .field-head .actions {
        display: flex;
        gap: 8px;
      }

      .mini-btn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 10px;
        border: 1px solid #bdbdbd;
        border-radius: 2px;
        color: #424242;
        background: #fff;
        font-size: 13px;
      }

      .mini-btn:hover {
        color: #fff;
        background: var(--blue);
        border-color: var(--blue);
      }

      .mini-btn .icon {
        font-size: 12px;
        line-height: 1;
      }

      /* 参数区 */
      .ops-body {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 14px;
      }

      .ops-body label {
        display: block;
        color: var(--ink);
      }

      .ops-body .hint {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .ops-body select,
      .ops-body input[type='number'],
      .ops-body input[type='text'] {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #bdbdbd;
        border-radius: 2px;
        outline: 0;
        color: #424242;
        background: #fff;
        font: inherit;
      }

      .ops-body select:focus,
      .ops-body input[type='number']:focus,
      .ops-body input[type='text']:focus {
        border-color: var(--blue);
      }

      .ops-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        min-height: 40px;
        padding: 0 12px;
        border: 1px solid #bdbdbd;
        border-radius: 2px;
        color: #424242;
        background: #fff;
        font-size: 15px;
      }

      .ops-btn:hover {
        color: #fff;
        background: var(--blue);
        border-color: var(--blue);
      }

      .ops-btn:disabled {
        color: #9e9e9e;
        background: #f5f5f5;
        border-color: #d5d5d5;
        cursor: default;
      }

      #msg {
        margin: 0;
        color: #d32f2f;
        font-size: 13px;
        white-space: pre-wrap;
        word-break: break-all;
      }

      #msg.ok {
        color: #2e7d32;
      }

      #msg:empty {
        display: none;
      }

      /* 进度条 */
      .progress-track {
        height: 10px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: #f5f5f5;
        overflow: hidden;
      }

      .progress-fill {
        width: 0;
        height: 100%;
        background: var(--blue);
        transition: width 0.2s;
      }

      #progress-text {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        text-align: right;
      }

      #progress-text:empty {
        display: none;
      }

      /* 页面缩略图区（固定高度，超出向下滚动） */
      .pages-body {
        flex: none;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 14px;
        align-content: start;
        height: 560px;
        padding: 14px;
        overflow-y: auto;
        scrollbar-width: none;
      }

      .pages-body::-webkit-scrollbar {
        display: none;
      }

      .page-card {
        display: flex;
        flex-direction: column;
        border: 1px solid var(--line);
        background: #fff;
      }

      .page-card .thumb {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 140px;
        padding: 8px;
        border-bottom: 1px solid var(--line);
        background: repeating-conic-gradient(#f8f8f8 0 25%, #fff 0 50%) 0 0 / 16px 16px;
      }

      .page-card .thumb img {
        max-width: 100%;
        max-height: 220px;
        object-fit: contain;
        cursor: zoom-in;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18);
      }

      .page-card .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 10px;
        color: var(--muted);
        font-size: 12px;
      }

      .page-card .bar b {
        color: var(--ink);
      }

      .page-card .bar button {
        padding: 3px 8px;
        border: 1px solid #bdbdbd;
        border-radius: 2px;
        color: #424242;
        background: #fff;
        font-size: 12px;
      }

      .page-card .bar button:hover {
        color: #fff;
        background: var(--blue);
        border-color: var(--blue);
      }

      .preview-empty {
        grid-column: 1 / -1;
        align-self: center;
        justify-self: center;
        color: #bdbdbd;
        font-size: 14px;
        -webkit-user-select: none;
        user-select: none;
      }

      .file-meta {
        padding: 10px 12px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        background: var(--panel);
        font-size: 13px;
        overflow-wrap: anywhere;
      }

      .file-meta b {
        color: var(--ink);
      }

      .file-meta:empty {
        display: none;
      }

      /* 底部提示区 */
      .tip-banner {
        margin-top: 20px;
        padding: 12px 16px;
        border: 1px solid #ffe0b2;
        color: #e65100;
        background: #fff3e0;
      }

      @media (max-width: 840px) {
        .pdf-grid {
          grid-template-columns: 1fr;
        }

        .pdf-grid .editor-panel {
          min-height: 0;
        }
      }
    </style>
  </head>

  <body>
    <div class="page">
      <nav class="top-nav" aria-label="转换工具导航">
        <a class="active" href="#pdf">PDF转图片</a>
      </nav>

      <main class="workspace" id="pdf">
        <h1>PDF转图片</h1>

        <section class="pdf-grid" aria-label="PDF 转图片区域">
          <!-- 参数区域 -->
          <div class="editor-panel">
            <div class="panel-label">转换参数</div>
            <div class="ops-body">
              <div>
                <label for="opt-format">图片格式：</label>
                <select id="opt-format">
                  <option value="image/png" selected>PNG</option>
                  <option value="image/jpeg">JPEG</option>
                  <option value="image/webp">WebP</option>
                </select>
              </div>
              <div>
                <label for="opt-quality">图片质量：</label>
                <input type="number" id="opt-quality" min="0.1" max="1" step="0.05" value="0.92" />
                <p class="hint">仅 JPEG / WebP 有效（0.1 ~ 1）</p>
              </div>
              <div>
                <label for="opt-scale">缩放倍数：</label>
                <select id="opt-scale">
                  <option value="1">1x（原始尺寸）</option>
                  <option value="1.5">1.5x</option>
                  <option value="2" selected>2x（推荐）</option>
                  <option value="3">3x</option>
                  <option value="4">4x（高清）</option>
                </select>
                <p class="hint">倍数越高越清晰，文件也越大</p>
              </div>
              <div>
                <label for="opt-range">页码范围：</label>
                <input type="text" id="opt-range" placeholder="如 1-3,5,8-10，留空表示全部" />
                <p class="hint">仅转换指定的页（逗号分隔，支持区间）</p>
              </div>
              <button class="ops-btn" type="button" id="pick-btn">📂 选择 PDF 文件</button>
              <input type="file" id="file-input" accept="application/pdf,.pdf" hidden />
              <button class="ops-btn" type="button" id="convert-btn" disabled>⬇ 开始转换</button>
              <button class="ops-btn" type="button" id="download-all-btn" hidden>⬇ 下载全部图片</button>
              <div class="progress-track" hidden id="progress-wrap"><div class="progress-fill" id="progress-fill"></div></div>
              <p id="progress-text"></p>
              <p id="msg" role="status" aria-live="polite"></p>
            </div>
          </div>

          <!-- 转换结果区域 -->
          <div class="editor-panel">
            <div class="field-head">
              <span>转换结果</span>
            </div>
            <div class="pages-body" id="pages-body"><span class="preview-empty">转换结果将显示在这里</span></div>
            <div class="file-meta" id="file-meta"></div>
          </div>
        </section>

        <div class="tip-banner">提示：PDF 转图片完全在你的浏览器本地完成（基于 pdf.js），不会上传到任何服务器！</div>
      </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.15.2/viewer.min.js"></script>
    <script type="module">
      // ================= PDF 转图片逻辑（纯客户端，基于 pdf.js ESM） =================
      import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.4.299/pdf.min.mjs';

      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.4.299/pdf.worker.min.mjs';

      const fileInput = document.querySelector('#file-input');
      const pickBtn = document.querySelector('#pick-btn');
      const convertBtn = document.querySelector('#convert-btn');
      const downloadAllBtn = document.querySelector('#download-all-btn');
      const msg = document.querySelector('#msg');
      const progressWrap = document.querySelector('#progress-wrap');
      const progressFill = document.querySelector('#progress-fill');
      const progressText = document.querySelector('#progress-text');
      const pagesBody = document.querySelector('#pages-body');
      const fileMeta = document.querySelector('#file-meta');

      let currentFile = null;
      const pageImages = []; // { name, url }
      let viewer = null; // Viewer.js 实例（转换完成后重建）

      function formatSize(bytes) {
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / 1024 / 1024).toFixed(2)} MB`;
      }

      // ---------- 解析页码范围（如 1-3,5,8-10） ----------
      function parseRange(text, pageCount) {
        text = text.trim();
        if (!text) return Array.from({ length: pageCount }, (_, i) => i + 1);
        const set = new Set();
        for (const part of text.split(/[,，\s]+/)) {
          const m = part.match(/^(\d+)(?:-(\d+))?$/);
          if (!m) throw new Error(`页码范围格式错误：“${part}”`);
          const start = parseInt(m[1], 10);
          const end = m[2] ? parseInt(m[2], 10) : start;
          if (start < 1 || end > pageCount || start > end) throw new Error(`页码超出范围（共 ${pageCount} 页）：“${part}”`);
          for (let i = start; i <= end; i++) set.add(i);
        }
        return [...set].sort((a, b) => a - b);
      }

      // ---------- 选择文件 ----------
      pickBtn.addEventListener('click', () => fileInput.click());

      fileInput.addEventListener('change', () => {
        const file = fileInput.files[0];
        if (!file) return;
        msg.textContent = '';
        msg.className = '';
        currentFile = file;
        convertBtn.disabled = false;
        downloadAllBtn.hidden = true;
        fileMeta.innerHTML = `<b>${file.name}</b>　${formatSize(file.size)}`;
        // 清空上一次结果
        clearResults();
      });

      function clearResults() {
        if (viewer) {
          viewer.destroy();
          viewer = null;
        }
        pageImages.forEach(p => URL.revokeObjectURL(p.url));
        pageImages.length = 0;
        pagesBody.innerHTML = '<span class="preview-empty">转换结果将显示在这里</span>';
        progressWrap.hidden = true;
        progressFill.style.width = '0';
        progressText.textContent = '';
      }

      // ---------- 转换 ----------
      async function convert() {
        if (!currentFile) return;
        msg.textContent = '';
        msg.className = '';
        clearResults();
        convertBtn.disabled = true;
        progressWrap.hidden = false;
        progressFill.style.width = '0';
        progressText.textContent = '0%';
        try {
          const buf = await currentFile.arrayBuffer();
          const doc = await pdfjsLib.getDocument({ data: buf }).promise;
          const pages = parseRange(document.querySelector('#opt-range').value, doc.numPages);
          const format = document.querySelector('#opt-format').value;
          const quality = Math.min(1, Math.max(0.1, parseFloat(document.querySelector('#opt-quality').value) || 0.92));
          const scale = parseFloat(document.querySelector('#opt-scale').value) || 2;
          const ext = format.split('/')[1].replace('jpeg', 'jpg');

          for (let idx = 0; idx < pages.length; idx++) {
            const pageNum = pages[idx];
            const page = await doc.getPage(pageNum);
            const viewport = page.getViewport({ scale });
            const canvas = document.createElement('canvas');
            canvas.width = Math.floor(viewport.width);
            canvas.height = Math.floor(viewport.height);
            const ctx = canvas.getContext('2d');
            await page.render({ canvasContext: ctx, viewport }).promise;
            const blob = await new Promise(resolve => canvas.toBlob(resolve, format, quality));
            const name = `${currentFile.name.replace(/\.pdf$/i, '')}-第${pageNum}页.${ext}`;
            const url = URL.createObjectURL(blob);
            const item = { name, url };
            pageImages.push(item);

            const empty = pagesBody.querySelector('.preview-empty');
            if (empty) empty.remove();
            const card = document.createElement('div');
            card.className = 'page-card';
            card.innerHTML = `
              <div class="thumb"><img src="${url}" alt="第 ${pageNum} 页预览" /></div>
              <div class="bar"><span><b>第 ${pageNum} 页</b>　${formatSize(blob.size)}</span><button type="button">⬇ 下载</button></div>`;
            card.querySelector('button').addEventListener('click', () => downloadOne(item));
            pagesBody.appendChild(card);
            canvas.width = canvas.height = 0; // 释放内存

            const pct = Math.round(((idx + 1) / pages.length) * 100);
            progressFill.style.width = `${pct}%`;
            progressText.textContent = `${pct}%（${idx + 1}/${pages.length} 页）`;
          }

          progressFill.style.width = '100%';
          progressText.textContent = '100%';
          // 重建 Viewer：点击缩略图放大预览，可左右切换 / 底部缩略图导航 / 缩放工具栏
          if (viewer) viewer.destroy();
          viewer = new Viewer(pagesBody, { navbar: true, toolbar: true });
          fileMeta.innerHTML = `<b>${currentFile.name}</b>　共 ${doc.numPages} 页，本次转换 ${pages.length} 页`;
          downloadAllBtn.hidden = false;
          msg.className = 'ok';
          msg.textContent = `✔ 转换完成（${pages.length} 张图片）`;
        } catch (e) {
          msg.textContent = `✘ 转换失败：${e.message || e}`;
        } finally {
          convertBtn.disabled = false;
        }
      }

      // ---------- 下载 ----------
      function downloadOne(item) {
        const a = document.createElement('a');
        a.href = item.url;
        a.download = item.name;
        a.click();
      }

      downloadAllBtn.addEventListener('click', () => {
        // 逐个触发下载（小间隔避免被浏览器拦截）
        pageImages.forEach((item, i) => setTimeout(() => downloadOne(item), i * 300));
      });

      convertBtn.addEventListener('click', convert);
    </script>
  </body>
</html>
