<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MD5加密</title>
    <style>
      :root {
        --blue: #2196f3;
        --blue-dark: #1976d2;
        --ink: #424242;
        --muted: #757575;
        --line: #e0e0e0;
        --panel: #fafafa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--ink);
        background: #fff;
        font-family: Arial, 'Microsoft YaHei', sans-serif;
        font-size: 14px;
      }

      button,
      textarea,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .page {
        width: min(1160px, calc(100% - 32px));
        margin: 0 auto;
      }

      .top-nav {
        display: flex;
        align-items: stretch;
        min-height: 60px;
        overflow-x: auto;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }

      .top-nav a {
        display: inline-flex;
        align-items: center;
        min-height: 60px;
        padding: 0 26px;
        border-right: 1px solid var(--line);
        color: #424242;
        font-size: 18px;
        text-decoration: none;
      }

      .top-nav a:first-child {
        padding-left: 28px;
      }

      .top-nav a:hover,
      .top-nav a.active {
        color: var(--blue);
      }

      .top-nav a.active {
        border-bottom: 3px solid var(--blue);
      }

      .workspace {
        padding: 24px 0 42px;
      }

      h1 {
        margin: 0 0 12px;
        color: #333;
        font-size: 26px;
        font-weight: 600;
      }

      .editor-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        align-items: stretch;
      }

      .editor-panel {
        display: flex;
        min-width: 0;
        min-height: 400px;
        max-height: 400px;
        flex-direction: column;
        border: 1px solid #d5d5d5;
        background: #fff;
      }

      .editor-body {
        display: flex;
        flex: 1;
        min-height: 0;
      }

      .gutter {
        width: 44px;
        flex: 0 0 44px;
        padding: 16px 8px 16px 0;
        border-right: 1px solid #eee;
        color: #999;
        background: var(--panel);
        font-family: Menlo, Monaco, Consolas, monospace;
        font-size: 14px;
        line-height: 1.7;
        text-align: right;
        white-space: pre;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
      }

      textarea {
        width: 100%;
        flex: 1;
        margin: 0;
        padding: 16px;
        border: 0;
        outline: 0;
        resize: none;
        color: #424242;
        background: #fff;
        font-family: Menlo, Monaco, Consolas, monospace;
        font-size: 14px;
        line-height: 1.7;
        overflow: auto;
        scrollbar-width: none;
        white-space: pre-wrap;
        word-break: break-word;
      }

      textarea::-webkit-scrollbar {
        display: none;
      }

      textarea:focus {
        box-shadow: inset 0 0 0 2px #bbdefb;
      }

      /* 右侧四行结果 */
      .results {
        display: flex;
        min-width: 0;
        flex-direction: column;
        justify-content: center;
        gap: 18px;
      }

      .result-row {
        display: flex;
        align-items: stretch;
        border: 1px solid #d5d5d5;
        background: #fff;
      }

      .result-label {
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 96px;
        padding: 0 12px;
        border-right: 1px solid #d5d5d5;
        background: var(--panel);
        font-size: 14px;
        -webkit-user-select: none;
        user-select: none;
      }

      .result-row input {
        width: 100%;
        min-width: 0;
        flex: 1;
        padding: 0 12px;
        border: 0;
        outline: 0;
        color: #424242;
        background: #fff;
        font-family: Menlo, Monaco, Consolas, monospace;
        font-size: 14px;
      }

      .result-row .copy-btn {
        min-width: 64px;
        padding: 10px 14px;
        border: 0;
        border-left: 1px solid #d5d5d5;
        color: #424242;
        background: #f5f5f5;
        font-size: 14px;
      }

      .result-row .copy-btn:hover {
        color: #fff;
        background: var(--blue);
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: stretch;
        margin-top: 14px;
        border: 1px solid #bdbdbd;
        background: #f5f5f5;
      }

      .toolbar button {
        min-height: 44px;
        padding: 0 17px;
        border: 0;
        border-right: 1px solid #bdbdbd;
        color: #424242;
        background: transparent;
        font-size: 15px;
      }

      .toolbar button:hover {
        color: #fff;
        background: var(--blue);
      }

      .toolbar button.primary {
        color: #fff;
        background: var(--blue);
      }

      .toolbar button.primary:hover {
        background: var(--blue-dark);
      }

      @media (max-width: 840px) {
        .page {
          width: min(100% - 24px, 680px);
        }

        .top-nav {
          margin: 0 -12px;
          padding-left: 12px;
        }

        .top-nav a {
          padding: 0 16px;
          font-size: 16px;
        }

        .top-nav a:first-child {
          padding-left: 16px;
        }

        .workspace {
          padding-top: 22px;
        }

        .editor-grid {
          grid-template-columns: 1fr;
          gap: 16px;
        }

        .editor-panel {
          min-height: 320px;
          max-height: 320px;
        }
      }

      @media (max-width: 480px) {
        h1 {
          font-size: 23px;
        }

        .toolbar button {
          flex: 1 0 33.333%;
          border-bottom: 1px solid #bdbdbd;
        }
      }
    </style>
  </head>

  <body>
    <div class="page">
      <nav class="top-nav" aria-label="MD5 工具导航">
        <a class="active" href="#md5">MD5加密</a>
      </nav>

      <main class="workspace" id="md5">
        <h1>MD5加密</h1>
        <section class="editor-grid" aria-label="MD5 编辑区域">
          <div class="editor-panel">
            <div class="editor-body">
              <div class="gutter" id="input-gutter" aria-hidden="true">1</div>
              <textarea id="input-text" spellcheck="false" placeholder="请在此输入需要加密的文本"></textarea>
            </div>
          </div>
          <div class="results" aria-label="MD5 加密结果">
            <div class="result-row">
              <span class="result-label">32位大写</span>
              <input type="text" readonly data-out="upper32" />
              <button class="copy-btn" type="button">复制</button>
            </div>
            <div class="result-row">
              <span class="result-label">32位小写</span>
              <input type="text" readonly data-out="lower32" />
              <button class="copy-btn" type="button">复制</button>
            </div>
            <div class="result-row">
              <span class="result-label">16位大写</span>
              <input type="text" readonly data-out="upper16" />
              <button class="copy-btn" type="button">复制</button>
            </div>
            <div class="result-row">
              <span class="result-label">16位小写</span>
              <input type="text" readonly data-out="lower16" />
              <button class="copy-btn" type="button">复制</button>
            </div>
          </div>
        </section>

        <div class="toolbar" role="toolbar" aria-label="MD5 操作">
          <button class="primary" id="md5-button" type="button">MD5加密</button>
          <button id="clear-button" type="button">清空</button>
        </div>
      </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script>
      // ---------- 行号 ----------
      const input = document.querySelector('#input-text');
      const inputGutter = document.querySelector('#input-gutter');

      function renderGutter(gutter, lines) {
        let nums = '';
        for (let i = 1; i <= Math.max(lines, 1); i++) nums += i + '\n';
        gutter.textContent = nums;
      }

      input.addEventListener('input', () => {
        renderGutter(inputGutter, input.value.split('\n').length);
      });
      input.addEventListener('scroll', () => {
        inputGutter.scrollTop = input.scrollTop;
      });

      // ---------- 加密 / 清空 / 复制 ----------
      const outputs = {
        upper32: document.querySelector('[data-out="upper32"]'),
        lower32: document.querySelector('[data-out="lower32"]'),
        upper16: document.querySelector('[data-out="upper16"]'),
        lower16: document.querySelector('[data-out="lower16"]')
      };

      document.querySelector('#md5-button').addEventListener('click', () => {
        if (!input.value) return;
        const hash = CryptoJS.MD5(input.value).toString();
        outputs.lower32.value = hash;
        outputs.upper32.value = hash.toUpperCase();
        // 16 位取 32 位摘要的中间 16 个字符
        outputs.lower16.value = hash.substring(8, 24);
        outputs.upper16.value = hash.substring(8, 24).toUpperCase();
      });

      document.querySelector('#clear-button').addEventListener('click', () => {
        input.value = '';
        renderGutter(inputGutter, 1);
        Object.values(outputs).forEach(el => (el.value = ''));
      });

      document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const value = btn.parentElement.querySelector('input').value;
          if (!value) return;
          await navigator.clipboard.writeText(value);
        });
      });
    </script>
  </body>
</html>
