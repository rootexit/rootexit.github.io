<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rootexit工具箱</title>
    <style>
      :root {
        --blue: #4285f4;
        --ink: #202124;
        --muted: #70757a;
        --line: #d4d4d4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--ink);
        background: #fff;
        font-family: Arial, 'Microsoft YaHei', sans-serif;
        line-height: 1.6;
      }

      a {
        color: var(--blue);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .app-shell {
        width: min(1080px, calc(100% - 32px));
        margin: 0 auto;
        padding: 46px 0 64px;
      }

      .intro {
        margin: 0 0 52px;
        color: #202124;
        font-size: 14px;
      }

      .tool-grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 16px;
      }

      .tool-section {
        grid-column: span 2;
        min-height: 300px;
        padding: 18px 17px 22px;
        border: 1px solid #e1e1e1;
        border-radius: 2px;
        background: #fff;
        box-shadow: 0 2px 7px rgba(60, 64, 67, 0.28);
        opacity: 1;
        transform: none;
        transition:
          opacity 0.35s ease,
          transform 0.35s ease;
      }

      .tool-section.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      .tool-section:nth-child(n + 4) {
        grid-column: span 3;
        min-height: 212px;
      }

      .section-heading {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 14px;
        font-size: 16px;
        font-weight: 400;
      }

      .section-icon {
        display: inline-grid;
        place-items: center;
        width: 22px;
        height: 22px;
        color: #fff;
        background: #292929;
        border-radius: 2px;
        font-size: 14px;
        font-weight: 700;
        line-height: 1;
      }

      .section-rule {
        height: 1px;
        margin-bottom: 17px;
        background: #c9c9c9;
      }

      .section-content {
        display: grid;
        gap: 10px;
        color: var(--muted);
        font-size: 15px;
      }

      .section-content p {
        margin: 0;
      }

      .section-content a {
        font-weight: 600;
      }

      @media (max-width: 840px) {
        .app-shell {
          width: min(100% - 32px, 680px);
          padding-top: 32px;
        }

        .intro {
          margin-bottom: 28px;
        }

        .tool-grid {
          grid-template-columns: 1fr;
          gap: 16px;
        }

        .tool-section,
        .tool-section:nth-child(n + 4) {
          grid-column: 1;
          min-height: 0;
        }
      }

      @media (max-width: 480px) {
        .app-shell {
          width: min(100% - 24px, 680px);
          padding-bottom: 36px;
        }

        .section-heading {
          font-size: 17px;
        }
      }
    </style>
  </head>

    <script>
      const cards = document.querySelectorAll('.tool-section');
      const revealCards = () =>
        cards.forEach((card, index) => {
          window.setTimeout(() => card.classList.add('is-visible'), index * 70);
        });
      if ('IntersectionObserver' in window) {
        const observer = new IntersectionObserver(
          (entries, currentObserver) => {
            entries.forEach(entry => {
              if (entry.isIntersecting) {
                entry.target.classList.add('is-visible');
                currentObserver.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.12 }
        );
        cards.forEach(card => observer.observe(card));
      } else {
        revealCards();
      }
    </script>
